# Publie le site vitrine AURA (dossier site/) sur GitHub Pages.
# Prérequis (une seule fois) : Settings > Pages > Source = "GitHub Actions".
# Source réglée sur « GitHub Actions » : ce workflow sert site/ à la racine.
# Voir docs/site-web.md.
name: Site web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Ne publie que depuis le dépôt public de l'organisation : une copie de ce
    # workflow dans un autre dépôt (dépôt de code privé, fork) ne déploie rien.
    if: github.repository == 'aura-projet/aura-projet.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
