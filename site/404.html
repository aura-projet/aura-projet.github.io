<html lang="fr">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; object-src 'none'">
  <meta name="robots" content="noindex">
  <title>Page introuvable · AURA</title>

  <script src="/assets/js/boot.js"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/i18n.js" defer></script>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="eyebrow">Erreur 404</p>
      <h1 class="gradient-text">404</h1>
      <p>Même notre sonde ne trouve pas cette page.</p>
      <a class="btn btn--primary" href="/">Retour à l'accueil</a>
    </div>
  </main>
</body>
</html>
