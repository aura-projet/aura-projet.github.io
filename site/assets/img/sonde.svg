<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a54"/><stop offset="1" stop-color="#2a2a31"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26262c"/><stop offset="1" stop-color="#1a1a1f"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121216"/><stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6d6"/><stop offset=".5" stop-color="#6e7bff"/><stop offset="1" stop-color="#c86bfa"/>
    </linearGradient>
    <linearGradient id="ant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3a42"/><stop offset=".45" stop-color="#5c5c66"/><stop offset="1" stop-color="#1f1f25"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- ombre portée -->
  <ellipse cx="300" cy="455" rx="190" ry="34" fill="#000" opacity=".7" filter="url(#blur)"/>

  <!-- antenne -->
  <g>
    <ellipse cx="404" cy="300" rx="20" ry="11" fill="#111115"/>
    <rect x="394" y="86" width="20" height="214" rx="10" fill="url(#ant)"/>
    <rect x="392" y="236" width="24" height="16" rx="5" fill="#2c2c33"/>
    <circle cx="404" cy="96" r="4" fill="#6e7bff" opacity=".9"/>
    <g fill="none" stroke="url(#aura)" stroke-linecap="round">
      <path d="M376 70a40 40 0 0 1 56 0" stroke-width="4" opacity=".9"/>
      <path d="M360 52a64 64 0 0 1 88 0" stroke-width="3.5" opacity=".6"/>
      <path d="M344 34a88 88 0 0 1 120 0" stroke-width="3" opacity=".35"/>
    </g>
  </g>

  <!-- boîtier isométrique -->
  <polygon points="260,190 459,305 329,380 130,265" fill="url(#top)"/>
  <polygon points="130,265 329,380 329,470 130,355" fill="url(#left)"/>
  <polygon points="329,380 459,305 459,395 329,470" fill="url(#right)"/>
  <!-- arêtes adoucies -->
  <polyline points="130,265 329,380 459,305" fill="none" stroke="#6a6a75" stroke-width="1.5" opacity=".7"/>
  <polyline points="329,380 329,470" fill="none" stroke="#3c3c44" stroke-width="1.2"/>

  <!-- antenne qui ressort du capot -->
  <ellipse cx="404" cy="300" rx="16" ry="9" fill="#0e0e12" opacity=".9"/>
  <rect x="396" y="250" width="16" height="50" rx="8" fill="url(#ant)"/>

  <!-- logo gravé sur le capot -->
  <g transform="translate(286 282) matrix(.866 .5 -.866 .5 0 0)" fill="none" stroke="url(#aura)" stroke-linecap="round">
    <circle r="9" fill="url(#aura)" stroke="none"/>
    <path d="M-20 -20a28 28 0 0 0 0 40M20 -20a28 28 0 0 1 0 40" stroke-width="5"/>
    <path d="M-34 -34a48 48 0 0 0 0 68M34 -34a48 48 0 0 1 0 68" stroke-width="4" opacity=".5"/>
  </g>

  <!-- aérations -->
  <g stroke="#0c0c10" stroke-width="3" stroke-linecap="round">
    <line x1="200" y1="322" x2="290" y2="374"/>
    <line x1="200" y1="334" x2="290" y2="386"/>
    <line x1="200" y1="346" x2="290" y2="398"/>
    <line x1="200" y1="358" x2="290" y2="410"/>
  </g>

  <!-- inscription AURA -->
  <g transform="translate(150 303) matrix(.866 .5 0 1 0 0)">
    <text x="0" y="0" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#8a8a96">AURA</text>
  </g>

  <!-- bandeau lumineux -->
  <line x1="150" y1="343" x2="309" y2="435" stroke="#2ee6d6" stroke-width="7" stroke-linecap="round" filter="url(#glow)" opacity=".9"/>
  <line x1="150" y1="343" x2="309" y2="435" stroke="#c9fffa" stroke-width="2.4" stroke-linecap="round"/>

  <!-- port USB sur la face droite -->
  <polygon points="372,412 400,396 400,408 372,424" fill="#050507"/>
  <polygon points="414,388 436,375 436,383 414,396" fill="#050507"/>
</svg>
